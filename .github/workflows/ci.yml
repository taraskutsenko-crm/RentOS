name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rentos
          POSTGRES_PASSWORD: rentos
          POSTGRES_DB: rentos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentos -d rentos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Genuinely reachable for GET /health's real TCP connectivity check
      # (see health.controller.ts / DECISIONS.md D-109) — no application
      # code connects to Redis for anything else yet.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rentos:rentos@localhost:5432/rentos_test?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture governance checks (i18n parity, permission sync, doc links, document variable parity)
        run: pnpm check:governance

      - name: Governance checks unit tests
        run: pnpm test:governance-checks

      - name: Apply test database migrations
        run: pnpm --filter @rentos/api exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
