name: rentos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentos}
      POSTGRES_DB: ${POSTGRES_DB:-rentos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentos} -d ${POSTGRES_DB:-rentos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rentos}:${POSTGRES_PASSWORD:-rentos}@postgres:5432/${POSTGRES_DB:-rentos}?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-me-dev-only-change-me-dev-only}
      JWT_CUSTOMER_ACCESS_SECRET: ${JWT_CUSTOMER_ACCESS_SECRET:-dev-only-change-me-portal-dev-only-change-me}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/storage-uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-logging}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      KSEF_ENCRYPTION_KEY: ${KSEF_ENCRYPTION_KEY:-467bc28bf643d5e05d8f7bb4b03b2e531be5659d65c009d64b7ef188828393e4}
      # Havelio Billing (Stage 17) — Stripe. All optional (StripeProvider.
      # isConfigured() gates real functionality); STRIPE_PUBLISHABLE_KEY is
      # deliberately NOT wired here — it's declared in the env schema but
      # unused by the application (server-redirect Checkout/Portal only,
      # no Stripe.js in the browser). See docs/DECISIONS.md.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER_MONTHLY: ${STRIPE_PRICE_STARTER_MONTHLY:-}
      STRIPE_PRICE_STARTER_ANNUAL: ${STRIPE_PRICE_STARTER_ANNUAL:-}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${STRIPE_PRICE_BUSINESS_MONTHLY:-}
      STRIPE_PRICE_BUSINESS_ANNUAL: ${STRIPE_PRICE_BUSINESS_ANNUAL:-}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${STRIPE_PRICE_PROFESSIONAL_MONTHLY:-}
      STRIPE_PRICE_PROFESSIONAL_ANNUAL: ${STRIPE_PRICE_PROFESSIONAL_ANNUAL:-}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - api_storage:/app/storage-uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # Real S3-compatible object storage for local verification of
  # S3StorageAdapter — opt-in (`docker compose --profile s3 up`), never
  # started by a plain `docker compose up`. To use it: set
  # STORAGE_DRIVER=s3, S3_ENDPOINT=http://minio:9000, S3_REGION=us-east-1,
  # S3_BUCKET=havelio-uploads, S3_ACCESS_KEY_ID=minioadmin,
  # S3_SECRET_ACCESS_KEY=minioadmin, S3_FORCE_PATH_STYLE=true, then
  # create the bucket once via the console at http://localhost:9001. See
  # docs/adr/0013-production-storage-and-email.md.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Real (local-only) SMTP sink for verifying SmtpEmailProvider actually
  # sends mail, without a genuine external provider — opt-in (`docker
  # compose --profile smtp up`). To use it: set EMAIL_DRIVER=smtp,
  # SMTP_HOST=mailhog, SMTP_PORT=1025, SMTP_SECURE=false,
  # SMTP_FROM_EMAIL=no-reply@havelio.local (SMTP_USER/SMTP_PASSWORD can be
  # any non-empty value — MailHog accepts unauthenticated mail), then read
  # captured mail at http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    profiles: ["smtp"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  api_storage:
  minio_data:
